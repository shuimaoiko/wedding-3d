<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>我们万岁 · 姜禹婚礼相册</title>
<style>
  :root{ --gold:#d8b87a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;color:#e9e2d4}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;
         flex-direction:column;padding-top:44px;
         background:radial-gradient(120% 120% at 50% 30%,#15110b 0%,#000 70%)}
  canvas{max-width:100vw;max-height:100vh;display:block;border-radius:6px;
         box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(216,184,122,.15)}
  .hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
        font-size:13px;letter-spacing:.18em;color:rgba(233,226,212,.66);
        pointer-events:none;transition:opacity 1s ease;text-align:center;white-space:nowrap}
  .hint b{color:var(--gold);font-weight:600}
  .qrnote{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);max-width:94vw;
          font-size:13px;letter-spacing:.05em;color:rgba(216,184,122,.9);
          pointer-events:none;z-index:6;display:flex;align-items:center;gap:7px;white-space:nowrap;
          text-shadow:0 1px 6px rgba(0,0,0,.65)}
  .qrnote .ic{font-size:16px}
  .panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
         display:flex;gap:18px;align-items:center;padding:10px 16px;border-radius:999px;
         background:rgba(20,17,11,.6);backdrop-filter:blur(10px);
         border:1px solid rgba(216,184,122,.22);font-size:12px;z-index:5}
  .panel label{display:flex;align-items:center;gap:8px;letter-spacing:.08em;white-space:nowrap}
  input[type=range]{accent-color:var(--gold);width:120px}
  .sw{position:relative;width:38px;height:20px;border-radius:999px;background:rgba(255,255,255,.15);cursor:pointer;transition:.2s}
  .sw.on{background:rgba(216,184,122,.85)}
  .sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on i{left:20px}
  .tag{position:fixed;top:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.22em;
       color:rgba(216,184,122,.72);pointer-events:none;padding:0 56px}
  .mbtn{position:fixed;top:13px;right:14px;z-index:8;width:42px;height:42px;border-radius:50%;
        display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;
        background:rgba(20,17,11,.6);backdrop-filter:blur(8px);
        border:1px solid rgba(216,184,122,.3);color:var(--gold);transition:.2s;user-select:none}
  .mbtn:hover{background:rgba(40,32,20,.8)}
  .mbtn.off{opacity:.55}
  .mbtn .pulse{position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(216,184,122,.5);
        animation:pulse 2.2s ease-out infinite}
  .mbtn.off .pulse{display:none}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
  .credit{position:fixed;right:10px;bottom:8px;font-size:10px;letter-spacing:.02em;
          color:rgba(216,184,122,.38);z-index:4;pointer-events:none}
  /* 加载动画 */
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
          justify-content:center;gap:20px;transition:opacity .7s ease;
          background:radial-gradient(120% 120% at 50% 35%,#15110b 0%,#000 75%)}
  #loader.hide{opacity:0;pointer-events:none}
  .ring{width:48px;height:48px;border-radius:50%;
        border:3px solid rgba(216,184,122,.22);border-top-color:var(--gold);
        animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lt{font-size:13px;letter-spacing:.32em;color:rgba(216,184,122,.82)}
  .lbar{width:160px;height:3px;border-radius:3px;background:rgba(216,184,122,.15);overflow:hidden}
  .lbar i{display:block;height:100%;width:40%;border-radius:3px;background:var(--gold);
          animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  @media (max-width:520px){ .hint{font-size:11px} .panel{gap:12px;padding:8px 12px} input[type=range]{width:84px} }
</style>
</head>

    <div class="ring"></div>

const VERT = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2((gl_VertexID==2)?3.0:-1.0,(gl_VertexID==1)?3.0:-1.0);
  vUv = vec2(0.5)+0.5*p;
  gl_Position = vec4(p,0.0,1.0);
}`;
const FRAG = `#version 300 es
precision highp float;
uniform sampler2D uImg, uDepth;
uniform vec2 uOffset; uniform float uFocus; uniform vec4 uQR; uniform float uLock;
in vec2 vUv; out vec4 frag;
float box(vec2 uv, vec4 r){
  float fx = smoothstep(r.x-0.04,r.x,uv.x)*(1.0-smoothstep(r.z,r.z+0.04,uv.x));
  float fy = smoothstep(r.y-0.04,r.y,uv.y)*(1.0-smoothstep(r.w,r.w+0.04,uv.y));
  return clamp(fx*fy,0.0,1.0);
}
float edgeDamp(vec2 uv){
  vec2 px = 2.0/vec2(textureSize(uDepth,0));
  float gx = texture(uDepth,uv+vec2(px.x,0.0)).r - texture(uDepth,uv-vec2(px.x,0.0)).r;
  float gy = texture(uDepth,uv+vec2(0.0,px.y)).r - texture(uDepth,uv-vec2(0.0,px.y)).r;
  return 1.0 - 0.82*smoothstep(0.02, 0.11, length(vec2(gx,gy)));
}
void main(){
  vec2 uv = vUv;
  float d = texture(uDepth, uv).r;
  vec2 off = uOffset*(d-uFocus)*edgeDamp(uv);
  d = texture(uDepth, uv+off).r;
  off = uOffset*(d-uFocus)*edgeDamp(uv+off);
  float lock = (uLock>0.5)? (1.0-box(uv,uQR)) : 1.0;
  vec2 uv2 = clamp(uv+off*lock, 0.0, 1.0);
  frag = vec4(texture(uImg, uv2).rgb, 1.0);
}`;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const prog = gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
const U = {img:gl.getUniformLocation(prog,'uImg'),depth:gl.getUniformLocation(prog,'uDepth'),
  offset:gl.getUniformLocation(prog,'uOffset'),focus:gl.getUniformLocation(prog,'uFocus'),
  qr:gl.getUniformLocation(prog,'uQR'),lock:gl.getUniformLocation(prog,'uLock')};

function tex(unit){
  const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  return t;
}
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
const tImg=tex(0), tDep=tex(1);
let IW=1055, IH=1491, loaded=0;

function done(){ loaded++; if(loaded>=2) hideLoader(); }
function load(src,unit,t,cb){
  const im=new Image();
  im.onload=()=>{ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
    if(cb)cb(im); done(); };
  im.onerror=done; im.src=src;
}
load(IMG_SRC,0,tImg,(im)=>{IW=im.naturalWidth;IH=im.naturalHeight;resize();});
load(DEP_SRC,1,tDep);
gl.uniform1i(U.img,0); gl.uniform1i(U.depth,1);
gl.uniform1f(U.focus,0.35);
gl.uniform4f(U.qr,QR[0],QR[1],QR[2],QR[3]);

const loader=document.getElementById('loader');
function hideLoader(){ loader.classList.add('hide'); setTimeout(()=>loader.style.display='none',800); }
setTimeout(hideLoader, 9000);  // 兜底

// ---- 交互 ----
let ampUI=0.68, lock=0;
let tx=0,ty=0, cx=0,cy=0, lastMove=performance.now();
const MAXAMP=0.14;
let dragging=false;
document.getElementById('amp').addEventListener('input',e=>ampUI=e.target.value/100);
const qrsw=document.getElementById('qrsw');
qrsw.addEventListener('click',()=>{lock^=1;qrsw.classList.toggle('on',!!lock);});
function point(px,py){const r=cvs.getBoundingClientRect();
  tx=Math.max(-1,Math.min(1,((px-r.left)/r.width*2-1)));
  ty=Math.max(-1,Math.min(1,-((py-r.top)/r.height*2-1)));
  lastMove=performance.now();}
window.addEventListener('mousemove',e=>point(e.clientX,e.clientY));
window.addEventListener('mousedown',()=>dragging=true);
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('touchstart',e=>{if(e.touches[0]){dragging=true;point(e.touches[0].clientX,e.touches[0].clientY);}},{passive:true});
window.addEventListener('touchmove',e=>{if(e.touches[0])point(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',()=>{dragging=false;});
window.addEventListener('deviceorientation',e=>{ if(e.gamma==null)return;
  tx=Math.max(-1,Math.min(1,e.gamma/26)); ty=Math.max(-1,Math.min(1,(e.beta-45)/26));
  lastMove=performance.now();});

const hint=document.getElementById('hint');
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const maxW=Math.max(80,window.innerWidth-32), maxH=Math.max(80,window.innerHeight-44-120);
  let w=maxW, h=w*IH/IW; if(h>maxH){ h=maxH; w=h*IW/IH; }
  cvs.style.width=w+'px'; cvs.style.height=h+'px';
  cvs.width=Math.round(w*dpr); cvs.height=Math.round(h*dpr);
  gl.viewport(0,0,cvs.width,cvs.height);
}
window.addEventListener('resize',resize); resize();
function frame(now){
  if(now-lastMove>2600){ const t=now*0.0009; tx=Math.sin(t)*0.5; ty=Math.cos(t*0.8)*0.3; }
  const ease = dragging?0.30:0.18;
  cx+=(tx-cx)*ease; cy+=(ty-cy)*ease;
  const a=MAXAMP*ampUI;
  gl.uniform2f(U.offset, cx*a, cy*a); gl.uniform1f(U.lock, lock);
  gl.drawArrays(gl.TRIANGLES,0,3);
  hint.style.opacity = (now-lastMove>4000)?0.55:((now<5000)?0.85:0.0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- 背景音乐 ----
const bgm=document.getElementById('bgm'), mbtn=document.getElementById('mbtn'), mico=document.getElementById('mico');
bgm.volume=0.45;
let musicOn=true, started=false;
function refreshBtn(){ mico.textContent = musicOn ? '🔊' : '🔈'; mbtn.classList.toggle('off',!musicOn); }
function startAudio(){ if(started||!musicOn) return; bgm.play().then(()=>{started=true;}).catch(()=>{}); }
mbtn.addEventListener('click',(e)=>{ e.stopPropagation(); musicOn=!musicOn;
  if(musicOn){ bgm.play().then(()=>started=true).catch(()=>{}); } else { bgm.pause(); }
  refreshBtn(); });
// 默认尝试自动播放; 被浏览器拦截则在首次交互时启动
bgm.addEventListener('canplaythrough',()=>{ if(musicOn) bgm.play().then(()=>started=true).catch(()=>{}); },{once:true});
['pointerdown','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,startAudio,{passive:true}));
refreshBtn();
</script>
</body>
</html>
