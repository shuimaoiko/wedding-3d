<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>我们万岁 · 3D 互动海报</title>
<style>
  :root{ --gold:#d8b87a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;color:#e9e2d4}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;
         flex-direction:column;padding-top:44px;
         background:radial-gradient(120% 120% at 50% 30%,#15110b 0%,#000 70%)}
  canvas{max-width:100vw;max-height:100vh;display:block;border-radius:6px;
         box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(216,184,122,.15)}
  .hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
        font-size:13px;letter-spacing:.18em;color:rgba(233,226,212,.66);
        pointer-events:none;transition:opacity 1s ease;text-align:center;white-space:nowrap}
  .hint b{color:var(--gold);font-weight:600}
  .panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
         display:flex;gap:18px;align-items:center;padding:10px 16px;border-radius:999px;
         background:rgba(20,17,11,.6);backdrop-filter:blur(10px);
         border:1px solid rgba(216,184,122,.22);font-size:12px;z-index:5}
  .panel label{display:flex;align-items:center;gap:8px;letter-spacing:.08em;white-space:nowrap}
  input[type=range]{accent-color:var(--gold);width:120px}
  .sw{position:relative;width:38px;height:20px;border-radius:999px;background:rgba(255,255,255,.15);cursor:pointer;transition:.2s}
  .sw.on{background:rgba(216,184,122,.85)}
  .sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on i{left:20px}
  .tag{position:fixed;top:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.4em;
       color:rgba(216,184,122,.7);pointer-events:none}
  .qrnote{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);max-width:94vw;
          font-size:13px;letter-spacing:.05em;color:rgba(216,184,122,.9);
          pointer-events:none;z-index:6;display:flex;align-items:center;gap:7px;white-space:nowrap;
          text-shadow:0 1px 6px rgba(0,0,0,.65)}
  .qrnote .ic{font-size:16px}
  @media (max-width:520px){ .hint{font-size:11px;bottom:78px} .panel{gap:12px;padding:8px 12px} input[type=range]{width:84px} }
</style>
</head>
<body>
  <div class="tag">3D · 互动海报</div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="hint" id="hint">移动鼠标 / 倾斜手机 <b>感受立体</b></div>
  <div class="qrnote"><span class="ic">📸</span><span>可截图扫描二维码查看相册</span></div>
  <div class="panel">

    <label>二维码锁定 <span class="sw" id="qrsw"><i></i></span></label>
  </div>

// 二维码区域(归一化 uv, 左下角)：x0,y0,x1,y1 —— y 以底部为 0
const QR = [0.010, 0.020, 0.235, 0.215];

const cvs = document.getElementById('c');
const gl = cvs.getContext('webgl2', {antialias:true, alpha:false});
if(!gl){ document.body.innerHTML = '<p style="color:#fff;padding:40px">当前浏览器不支持 WebGL2，请用 Chrome / Safari 打开。</p>'; }

const VERT = `#version 300 es
precision highp float;
out vec2 vUv;
void main(){
  vec2 p = vec2((gl_VertexID==2)?3.0:-1.0,(gl_VertexID==1)?3.0:-1.0);
  vUv = vec2(0.5)+0.5*p;
  gl_Position = vec4(p,0.0,1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
uniform sampler2D uImg, uDepth;
uniform vec2 uOffset;     // 视差偏移(uv)
uniform float uFocus;     // 焦平面深度
uniform vec4 uQR;         // x0,y0,x1,y1
uniform float uLock;      // 1=锁定二维码
in vec2 vUv;
out vec4 frag;
float box(vec2 uv, vec4 r){
  float fx = smoothstep(r.x-0.04,r.x,uv.x)*(1.0-smoothstep(r.z,r.z+0.04,uv.x));
  float fy = smoothstep(r.y-0.04,r.y,uv.y)*(1.0-smoothstep(r.w,r.w+0.04,uv.y));
  return clamp(fx*fy,0.0,1.0);
}
void main(){
  vec2 uv = vUv;
  float d = texture(uDepth, uv).r;
  vec2 off = uOffset*(d-uFocus);
  // 一次迭代细化，减少拉伸
  d = texture(uDepth, uv+off).r;
  off = uOffset*(d-uFocus);
  float lock = (uLock>0.5)? (1.0-box(uv,uQR)) : 1.0; // 二维码区域 off→0
  vec2 uv2 = clamp(uv+off*lock, 0.0, 1.0);
  vec3 col = texture(uImg, uv2).rgb;
  frag = vec4(col,1.0);
}`;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const prog = gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog); gl.useProgram(prog);

const U = {
  img:gl.getUniformLocation(prog,'uImg'),
  depth:gl.getUniformLocation(prog,'uDepth'),
  offset:gl.getUniformLocation(prog,'uOffset'),
  focus:gl.getUniformLocation(prog,'uFocus'),
  qr:gl.getUniformLocation(prog,'uQR'),
  lock:gl.getUniformLocation(prog,'uLock'),
};

function tex(unit){
  const t=gl.createTexture();
  gl.activeTexture(gl.TEXTURE0+unit);
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  // 占位
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  return t;
}
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
const tImg=tex(0), tDep=tex(1);
let IW=1055, IH=1491;

function load(src,unit,t,cb){
  const im=new Image(); im.onload=()=>{
    gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
    if(cb)cb(im);
  }; im.src=src;
}
load(IMG_SRC,0,tImg,(im)=>{IW=im.naturalWidth;IH=im.naturalHeight;resize();});
load(DEP_SRC,1,tDep);

gl.uniform1i(U.img,0); gl.uniform1i(U.depth,1);
gl.uniform1f(U.focus,0.35);
gl.uniform4f(U.qr,QR[0],QR[1],QR[2],QR[3]);

// ---- 交互 ----
let ampUI=0.55, lock=0;
let tx=0,ty=0, cx=0,cy=0;       // 目标/当前偏移(-1..1)
let lastMove=performance.now();
const MAXAMP=0.075;             // 最大 uv 偏移

document.getElementById('amp').addEventListener('input',e=>ampUI=e.target.value/100);
const qrsw=document.getElementById('qrsw');
qrsw.addEventListener('click',()=>{lock^=1;qrsw.classList.toggle('on',!!lock);});

function point(px,py){
  const r=cvs.getBoundingClientRect();
  tx=((px-r.left)/r.width*2-1);
  ty=-((py-r.top)/r.height*2-1);
  tx=Math.max(-1,Math.min(1,tx)); ty=Math.max(-1,Math.min(1,ty));
  lastMove=performance.now();
}
window.addEventListener('mousemove',e=>point(e.clientX,e.clientY));
window.addEventListener('touchmove',e=>{if(e.touches[0])point(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('deviceorientation',e=>{
  if(e.gamma==null)return;
  tx=Math.max(-1,Math.min(1,e.gamma/35));
  ty=Math.max(-1,Math.min(1,(e.beta-45)/35));
  lastMove=performance.now();
});
// iOS 需要授权陀螺仪
window.addEventListener('click',()=>{
  if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
    DeviceOrientationEvent.requestPermission().catch(()=>{});
  }
},{once:true});

const hint=document.getElementById('hint');
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const maxW=Math.max(80,window.innerWidth-32), maxH=Math.max(80,window.innerHeight-44-120);
  let w=maxW, h=w*IH/IW;
  if(h>maxH){ h=maxH; w=h*IW/IH; }
  cvs.style.width=w+'px'; cvs.style.height=h+'px';
  cvs.width=Math.round(w*dpr); cvs.height=Math.round(h*dpr);
  gl.viewport(0,0,cvs.width,cvs.height);
}
window.addEventListener('resize',resize); resize();

function frame(now){
  // 空闲自动轻摆
  if(now-lastMove>2600){
    const t=now*0.0009;
    tx=Math.sin(t)*0.6; ty=Math.cos(t*0.8)*0.35;
  }
  cx+=(tx-cx)*0.07; cy+=(ty-cy)*0.07;
  const a=MAXAMP*ampUI;
  gl.uniform2f(U.offset, cx*a, cy*a);
  gl.uniform1f(U.lock, lock);
  gl.drawArrays(gl.TRIANGLES,0,3);
  hint.style.opacity = (now-lastMove>4000)?0.55:((now<5000)?0.85:0.0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
